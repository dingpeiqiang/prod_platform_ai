# ============================================================
# 容器外部配置（挂载到 /config/application.yml）
# 部署时按环境修改本文件，docker run 无需再传业务相关 -e
#
# 挂载示例：
#   docker run -d --name backend -p 6174:6174 \
#     -v /path/to/this/dir:/config:ro \
#     prod-platform-backend:2.0
# ============================================================

spring:
  profiles:
    active: prod
  # LLM 调用统一走手动构建（见 LlmService），禁用 OpenAI 自动配置，避免未使用 Bean
  autoconfigure:
    exclude:
      - org.springframework.ai.model.openai.autoconfigure.OpenAiChatAutoConfiguration
      - org.springframework.ai.model.openai.autoconfigure.OpenAiEmbeddingAutoConfiguration
      - org.springframework.ai.model.openai.autoconfigure.OpenAiImageAutoConfiguration
      - org.springframework.ai.model.openai.autoconfigure.OpenAiAudioSpeechAutoConfiguration
      - org.springframework.ai.model.openai.autoconfigure.OpenAiAudioTranscriptionAutoConfiguration
      - org.springframework.ai.model.openai.autoconfigure.OpenAiModerationAutoConfiguration
  datasource:
    # 默认 H2 内嵌库（挂载卷持久化）；接 MySQL 时设置 SPRING_DATASOURCE_URL 即可整体切回
    url: ${SPRING_DATASOURCE_URL:jdbc:h2:file:/config/data/prodplatformai;MODE=MySQL;DATABASE_TO_LOWER=TRUE;CASE_INSENSITIVE_IDENTIFIERS=TRUE;AUTO_SERVER=TRUE}
    driver-class-name: ${SPRING_DATASOURCE_DRIVER:org.h2.Driver}
    username: ${SPRING_DATASOURCE_USERNAME:sa}
    # 密码通过容器环境变量/密钥管理注入，禁止在配置文件中明文保存
    password: ${SPRING_DATASOURCE_PASSWORD:}
  sql:
    init:
      mode: ${SPRING_SQL_INIT_MODE:embedded}
      platform: ${SPRING_SQL_INIT_PLATFORM:h2}
      schema-locations: classpath:sql/h2/schema-h2.sql
      data-locations: classpath:sql/h2/data-h2.sql
  h2:
    console:
      enabled: ${H2_CONSOLE_ENABLED:false}
      path: /h2-console
  jpa:
    hibernate:
      ddl-auto: update

prodai:
  ontology:
    demo-enabled: false
    data-source: classpath
    graph-path: classpath:ontology/ops_graph_export.json
    ops-graph-path: classpath:ontology/ops_graph_export.json
    # 接外部产商品中心时改为：
    # data-source: http
    # product-center-base-url: http://product-center:8080
    product-center-base-url:
    product-center-timeout-ms: 5000
    llm-extract-enabled: true
    base-iri: http://example.org/
    rdf-seed-path:
    ttl-path:
  kb:
    seed-path:
  mcp:
    seed-path:
  llm:
    enabled: true
    function-calling-enabled: true

logging:
  level:
    root: INFO
    com.sitech.prodai: INFO
