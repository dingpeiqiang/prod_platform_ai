# 手册（Playbook）：完成一类事情的标准作业程序
#
# 智查·历史复用的手册化（零副作用）：
#   工具已原子化——检索需求解析内联在 rd_config_search 参数预处理（不设独立解析环节），
#   本手册两步：检索 → 整理复用。
#   检索统一走本体知识库（LLM 意图结构化 → 参数化 SPARQL），0 命中如实告知。
#   智查是只读工具：无 session_id 绑定、无落库、无开单——手册不涉及任何写操作环节。
#
# 命名规范：文件名 = 手册 code（kebab-case），与 name 字段一致

# ── ① 元数据 ──────────────────────────────────────────
name: discover-history
title: 历史配置检索复用
description: 智查·历史复用场景——按检索需求在历史产商品配置方案中语义/关键词检索，命中后可复制为草稿继续配置
version: 1

# 适用域：路由器据此判定"本次请求是否适用本手册"（显式声明，替代场景级一刀切）；
# 路由只认业务意图——工具配置独一份在 AgentTool 注册表，步骤 tool 是调用语句
applies_to:
  scene: rd
  intents: [RD_CONFIG_DISCOVER]
  # 智查话术语义归理解层 LLM 识别：「找/查已有方案」归本手册，
  # 与智聊（配/生成/新建/做）区分，与智读（导入/解析）区分

# ── ② 步骤（操作步骤 + 每步的操作方法和使用的工具）─────
# 工具已原子化：检索需求解析内联在 rd_config_search 参数预处理，两步完成
steps:
  - id: search
    do: 检索历史配置方案
    how: 从话术提取检索要素（品类/月费区间/客群/渠道等，如「月费39左右的校园套餐」→ 品类=校园、月费≈39）；本体知识库语义检索（LLM 意图结构化 → 参数化 SPARQL）；上限默认 20 条；话术带检索词即用本工具，即使用户提到月费等套餐要素
    tool: rd_config_search

  - id: present
    do: 整理命中清单供复用
    how: 命中方案按相关性排序透出（名称/月费/客群/渠道要素随条目展示）；用户点击条目可「复制为草稿」流转到智聊继续编辑
    tool: rd_config_search
    policy: 只读不改档——检索不落库不开单；结果为空时明确告知无命中并建议放宽条件，不臆造方案

# ── ③ 护栏（控制语义：人工门 / 审计 / 兜底）─────────────
# 工具引用块已删除：工具配置独一份在 AgentTool 注册表，步骤 tool 即调用语句
guardrails:
  human_gate: []          # 纯只读检索，无写操作，无人工门
  audit: 检索词与命中数随 tool 事件下发；命中条目带原始配置标识（entity_ids）
  fallback:
    - 检索结果为空 → 明确告知「未找到匹配的历史配置」，建议放宽品类/月费条件
    - 检索服务异常 → 明确报错原因，不返回空结果冒充无命中
