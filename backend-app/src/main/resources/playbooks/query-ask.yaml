# 手册（Playbook）：完成一类事情的标准作业程序
#
# 产商品查询助手·智能问答的手册化（纯只读）：
#   工具已原子化——实体/资费要素的语义解析内联在 sparql_query 参数预处理（不设独立解析环节），
#   本手册两步：知识库查询 → 整理作答。
#   智能问答是只读链路：无落库、无开单、无草稿生成——手册不涉及任何写操作环节。
#
# 命名规范：文件名 = 手册 code（kebab-case），与 name 字段一致

# ── ① 元数据 ──────────────────────────────────────────
name: query-ask
title: 商品智能问答
description: 产商品查询助手·智能问答——自然语言转 SPARQL 在本体知识库查询商品资费/内容/办理限制，整理要素作答
version: 1

# 适用域：路由器据此判定"本次请求是否适用本手册"（显式声明，替代场景级一刀切）；
# 路由只认业务意图——工具配置独一份在 AgentTool 注册表，步骤 tool 是调用语句
applies_to:
  scene: query
  # query 场景规范意图码（IntentRecognitionSupport 归一化产物），首项为手册直达链路的计划意图
  intents: [SPARQL_QUERY, PRODUCT_OPS_QUERY]
  # 意图归口（手册 = 意图定义源，LLM 据此选意图码而非自由发挥）：
  #   随 renderSop 注入 system prompt，LLM 依据话术语义匹配归口声明输出 intent
  intent_guide:
    SPARQL_QUERY: "商品问答/资费要素/套餐内容/办理限制/商品状态等知识库查询"
  # 触发词快筛：路由器在 LLM 理解前先行匹配，命中直达手册链路（零 LLM 成本、消除误判）
  # 触发词只兜高置信度的专有话术（术语级：单独 substring 匹配不偏移）；宽泛话术交给理解层 LLM 识别
  triggers: ["月费多少", "资费", "套餐内容", "办理限制", "包含什么", "有哪些权益", "多少流量", "多少分钟", "包含多少"]

# ── ② 步骤（操作步骤 + 每步的操作方法和使用的工具）─────
# 工具已原子化：语义解析内联在 sparql_query 参数预处理，两步完成
steps:
  - id: query
    do: 知识库查询商品要素
    how: 从话术提取查询要素（商品名/品类/资费/客群等）；自然语言转 SPARQL 在本体知识库执行语义查询，实体发现 LLM 优先、关键词兜底；上限默认 20 个实体
    tool: sparql_query

  - id: present
    do: 整理要素作答
    how: 命中结果按用户问的维度整理（名称/月费/资费要素/办理限制随条目展示）；数字结论标注数据来源（本体知识库），不臆造不编数
    tool: sparql_query
    policy: 只读不改档——查询不落库不开单；结果为空时明确告知无命中并建议换个说法，不臆造答案

# ── ③ 护栏（控制语义：人工门 / 审计 / 兜底）─────────────
# 工具引用块已删除：工具配置独一份在 AgentTool 注册表，步骤 tool 即调用语句
guardrails:
  human_gate: []          # 纯只读查询，无写操作，无人工门
  audit: 查询实体数与命中数随 tool 事件下发；命中条目带原始实体标识（entity_ids）
  fallback:
    - 查询结果为空 → 明确告知「知识库中未找到匹配信息」，建议换个说法或补全商品名
    - 知识库异常 → 明确报错原因，不返回空结果冒充无命中
