# 手册（Playbook）：完成一类事情的标准作业程序
#
# 产品运营助手·运营问诊的手册化（与 rd 三本手册同构：确定性流程收拢到手册层）：
#   ops 场景的分析问诊是一次多工具协作（事实查询 → 归因 → 稽核 → 解释），
#   原 ops_analysis_v2 固化工作流（flow.tool 线性四节点）整体退役，由本手册接管：
#     ① 路由消费：applies_to.intents 命中 → SceneFlowRouter 回落动态编排，LLM 照手册执行
#     ② 编排消费：renderSop 注入 system prompt（DefaultUnderstander.playbookSopSection），
#        intent_guide 随 SOP 下发——LLM 依据手册归口声明选意图码（手册 = 意图定义源）
#   两条入口通向同一条手册直达链路（sop-step-N 时间线 + 环节 IO 差异化）：
#     - 触发词快筛（LLM 理解前）：高置信度专有话术直接命中，零 LLM 成本
#     - 意图升级（LLM 理解后）：LLM 照 intent_guide 归口输出意图码命中 applies_to.intents →
#       AgentOrchestrator 升级 runPlaybookPath/runPlaybookStream（归一化映射仅兜底自由意图）
#
# 命名规范：文件名 = 手册 code（kebab-case），与 name 字段一致
# 注意：多工具手册——步骤 tool 必须与真实执行一致，否则该步骤永远等不到执行事件；
#   本手册四步各对应一个真实工具执行（非单工具内部环节切分），依次各执行一次。

# ── ① 元数据 ──────────────────────────────────────────
name: ops-analysis
title: 运营问诊分析
description: 产品运营助手·运营问诊场景——事实查询打底，异动归因与风险稽核并行问诊，规则解释收尾给处置依据
version: 1

# 适用域：路由器据此判定"本次请求是否适用本手册"（显式声明，替代场景级一刀切）
applies_to:
  scene: ops
  # ops 场景规范意图码（IntentRecognitionSupport 归一化产物），首项为手册直达链路的计划意图
  intents: [PRODUCT_OPS_REASON, PRODUCT_OPS_POLICY, PRODUCT_OPS_QUERY, PRODUCT_OPS_MONITOR]
  tools: [sparql_query, swrl_root_cause, swrl_risk_audit, ontology_explain]
  # 意图归口（手册 = 意图定义源，LLM 据此选意图码而非自由发挥）：
  #   随 renderSop 注入 system prompt，LLM 依据话术语义匹配归口声明输出 intent——
  #   手册在这里显式声明"什么话术归什么意图码"，路由按声明匹配（不再靠归一化映射表修补）
  intent_guide:
    PRODUCT_OPS_QUERY:  "查经营数据/增长趋势/在售结构/商品清单等事实查询"
    PRODUCT_OPS_REASON: "为什么下滑/异动原因/根因分析等归因问诊"
    PRODUCT_OPS_POLICY: "风险稽核/是否合规/该不该下架等规则判定"
    PRODUCT_OPS_MONITOR: "持续盯盘/异动预警/周期监控类请求"
  # 触发词快筛：路由器在 LLM 理解前先行匹配，命中直达手册链路（零 LLM 成本、消除误判）
  # 触发词只兜高置信度的专有话术（术语级：单独 substring 匹配不偏移）；宽泛话术
  # （如「查一下…增长趋势」）交给理解层 LLM 识别——LLM 照 intent_guide 归口输出意图码，
  # 编排层升级走手册直达链路（AgentOrchestrator.runPlaybookPath/runPlaybookStream），
  # 与触发词快筛殊途同归，避免宽泛触发词在通用话术上误触发。
  triggers: ["根因分析", "异动分析", "归因分析", "经营分析",
             "风险稽核", "下架风险", "经营数据", "运营数据", "哪些商品"]

# ── ② 步骤（操作步骤 + 每步的操作方法和使用的工具）─────
steps:
  - id: facts
    do: 查询经营事实数据
    how: 自然语言转 SPARQL 在本体知识库执行语义查询；实体发现 LLM 优先、关键词兜底；上限默认 20 个实体
    tool: sparql_query

  - id: root-cause
    do: 异动根因归因
    how: SWRL 归因推理（R-A 系列规则）；显式商品优先，缺省从问题语义解析分析对象；归因路径逐条透出
    tool: swrl_root_cause
    policy: 归因结论须可追溯——命中的归因规则与推理引擎（openllet-swrl/java-rules）随 tool 事件下发，不臆造原因

  - id: risk-audit
    do: 在架商品风险稽核
    how: SWRL 风险推理全量筛查（显式 offeringIds 优先，缺省全量）；逐商品输出风险等级/分数/处置建议
    tool: swrl_risk_audit
    policy: 只读筛查不改档——稽核不落库不下架，处置建议仅供人工决策

  - id: explain
    do: 本体规则解释收尾
    how: 对问诊涉及的本体概念/规则给出自然语言解释，附引用规则编号，让归因与稽核结论有据可查
    tool: ontology_explain

# ── ③ 工具引用（必须是 AgentTool 注册表已存在的能力）────
tools:
  - sparql_query
  - swrl_root_cause
  - swrl_risk_audit
  - ontology_explain

# ── ④ 护栏（控制语义：人工门 / 审计 / 兜底）─────────────
guardrails:
  human_gate: []          # 纯分析问诊链路（查询/归因/稽核/解释均只读），无写操作，无人工门
  audit: 推理引擎标识（reasonEngine）与命中规则编号随 tool 事件下发；分析对象商品（offeringId/Name）随结论透出
  fallback:
    - 事实查询为空 → 归因与稽核照常执行（各有独立数据源），汇总时明确说明事实数据缺失
    - 归因推理无命中路径 → 如实告知未命中归因规则，不编造原因
    - 推理引擎异常 → 明确报错原因，不返回空结论冒充无风险
