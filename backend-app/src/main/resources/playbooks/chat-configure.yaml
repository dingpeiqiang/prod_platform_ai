# 手册（Playbook）：完成一类事情的标准作业程序
#
# 智聊·对话配置的手册化：工具已原子化，一个工具一个环节，步骤与工具 1:1
# （业务参数抽取 → 品类识别 → 草稿生成 → 合规校验 → 落库开单各自独立工具）。
#
# 命名规范：文件名 = 手册 code（kebab-case），与 name 字段一致

# ── ① 元数据 ──────────────────────────────────────────
name: chat-configure
title: 对话式配置草稿生成
description: 智聊·对话配置场景——按自然语言需求抽取业务参数、识别产品品类，生成配置草稿并合规校验，落库即开单
version: 2

# 适用域：路由器据此判定"本次请求是否适用本手册"（显式声明，替代场景级一刀切）；
# 路由只认业务意图——工具配置独一份在 AgentTool 注册表，步骤 tool 是调用语句
applies_to:
  scene: rd
  intents: [RD_CONFIG_CHAT]
  # 意图归口：LLM 理解层依据本声明选意图码（手册即意图定义源）
  intent_guide:
    RD_CONFIG_CHAT: 用户想创建/生成新的产商品配置（造新），话术带明确配置需求描述（月费/客群/宽带/渠道等要素或品类意向）
  # 正反样例（few-shot）：LLM 意图识别的判定素材——命中例给足语义锚点，
  # 反例声明易混淆话术的归属（智查/工单操作/咨询），降低「造新 vs 查已有」误判
  examples:
    hit:
      - "帮我配一个面向校园学生的融合套餐，月费59含宽带"
      - "做一套家庭版套餐，158元，500M宽带"
      - "设计一个5G主套餐，目标客群是商务人士，全渠道销售"
      - "新建一个流量附加包，20元2GB"
    negative:
      - "查一下有没有类似的校园套餐（→ 智查·历史复用，非本手册）"
      - "上次配的那个套餐做一个对比（→ 智查·方案对比）"
      - "为什么做一个套餐要填这么多要素（→ 咨询，不调用工具）"
      - "把这个工单提交了（→ 工单操作 rd_draft_manage）"

# ── ② 步骤（操作步骤 + 每步的操作方法和使用的工具）─────
steps:
  - id: category
    do: 识别产品品类
    how: 显式 product_type 优先；未提供时按模板 matchers 对话术识别（家庭融合/宽带/校园/5G 等品类特征词）；品类先行——品类决定抽取模板与 required_slots 缺要素口径
    tool: rd_category_resolve

  - id: extract
    do: 抽取业务参数（月费/客群/宽带/渠道/场景等结构化槽位）
    how: 正则配置模式快抽取优先，缺口 LLM 补抽（引擎与槽位白名单均为模板/配置驱动）；承接上游品类码（category_code）按该模板 required_slots 判定缺要素，missing_slots 明示不静默
    tool: rd_slot_extract
    input_from:
      category_code: rd_category_resolve.category_code

  - id: generate
    do: 生成配置草稿（名称/月费/要素/客群/渠道）
    how: 承接上游已抽槽位（slots）跳过二次抽取；按品类模板 derive 引擎产出草稿字段；缺名时按「模板名+资费特征」补名（如「家庭基础套餐·158元·500M」），避免副本退化为「配置草稿(副本)」
    tool: rd_draft_generate
    input_from:
      slots: rd_slot_extract.slots
      category_code: rd_category_resolve.category_code
    policy: 草稿字段须可追溯——名称/月费/宽带/客群/渠道逐项来自话术描述或模板补全，不臆造

  - id: compliance
    do: 合规校验
    how: 规则引擎 R-C 系列校验（SHACL 可声明化规则优先）；补名可能修复 R-C06（资费名称缺失），补名后须重跑校验刷新结论再开单
    tool: rd_compliance
    input_from:
      draft: rd_draft_generate.draft

  - id: create
    do: 落库并创建配置工单
    how: 草稿落库成功才开单（source=rd_config_chat，绑定当前会话）；落库失败不开单，避免 payload.draftId 缺失的孤儿工单
    tool: rd_workorder_create
    input_from:
      items: rd_compliance.draft
      compliance_pass: rd_compliance.compliance_pass
      issues: rd_compliance.issues
    output: work_order_id

# ── ③ 护栏（控制语义：人工门 / 审计 / 兜底）─────────────
# 工具引用块已删除：工具配置独一份在 AgentTool 注册表，步骤 tool 即调用语句
guardrails:
  human_gate: []          # 草稿生成即开单（待处理工单本身即人工核对入口），无额外确认门
  audit: 草稿落库标识（draftId）必须随工单 payload 关联；品类识别依据与抽取槽位明细（slots/missing_slots）随 tool 事件下发
  fallback:
    - 话术缺少可识别配置要素 → 不静默，按 missing_slots 明示缺失项并提示补充月费/客群等关键要素
    - 品类无法识别 → 明确告知并列出可识别品类，请用户显式指定
    - 草稿落库失败 → 工单不创建，明确告知用户重试
