# 步骤片段库（手册层复用单元，治理手册粒度膨胀）
#
# 下划线前缀 = 片段库（非手册）：不进 PlaybookRegistry 注册表（对路由/触发词/SOP 消费不可见），
# 仅供手册在 steps 中以 `use: <片段名>` 引用，装载期一次性展开为完整步骤。
# 覆写：引用项可携带同名字段覆写片段模板（如 do/how 措辞随手册语境微调），use 键不进结果。
#
# 粒度约定：片段 = 一类可复用的作业动作（查询/归因/稽核/解释），跨手册共性收敛在这里——
# 手册只声明「本入口用哪些动作、按什么顺序」，动作定义改一处全链生效，手册数不随入口重复定义膨胀。
#
# 可解析约束与手册同门禁：片段的 tool 字段参与工具引用校验（引用未注册工具整体拦截）。

title: ops 步骤片段库（跨手册复用）

steps:

  # 语义查询打底：本体知识库 NL→SPARQL，各入口手册的第一步（分析对象随话术变化，
  # 手册引用时通常覆写 do 以贴合语境）
  query-facts:
    do: 查询经营事实数据
    how: 自然语言转 SPARQL 在本体知识库执行语义查询；实体发现 LLM 优先、关键词兜底；上限默认 20 个实体
    tool: sparql_query

  # SWRL 归因推理：R-A 系列规则，归因问诊的核心动作
  root-cause:
    do: 异动根因归因
    how: SWRL 归因推理（R-A 系列规则）；显式商品优先，缺省从问题语义解析分析对象；归因路径逐条透出
    tool: swrl_root_cause
    policy: 归因结论须可追溯——命中的归因规则与推理引擎（openllet-swrl/java-rules）随 tool 事件下发，不臆造原因

  # SWRL 风险推理：R-B 系列规则，全量筛查（稽核/速览两种口径随手册覆写 how）
  risk-audit:
    do: 在架商品风险稽核
    how: SWRL 风险推理全量筛查（显式 offeringIds 优先，缺省全量）；逐商品输出风险等级/分数/处置建议
    tool: swrl_risk_audit
    policy: 只读筛查不改档——稽核不落库不下架，处置建议仅供人工决策

  # 规则语义解释：R 系列规则单条解释（稽核命中规则 / 立项门槛规则）
  rule-explain:
    do: 命中规则解释
    how: 对涉及的业务规则给出规则语义解释，附规则编号与关键阈值，让结论有据可查
    tool: rule_explain

  # 本体概念解释：跨概念/规则的自然语言解释收尾
  ontology-explain:
    do: 本体规则解释收尾
    how: 对涉及的本体概念/规则给出自然语言解释，附引用规则编号，让结论有据可查
    tool: ontology_explain
