server:
  port: 6174

spring:
  application:
    name: prod-platform-ai
  profiles:
    # 上线默认 prod（demo 关闭）；本地演示改 active:dev 或 --spring.profiles.active=dev
    active: prod
  # LLM 调用统一走手动构建（见 LlmService），不走 Spring AI 自动配置，
  # 因此禁用 OpenAI 自动配置并移除冗余的 spring.ai.openai.* 属性，避免创建未使用的 Bean。
  autoconfigure:
    exclude:
      - org.springframework.ai.model.openai.autoconfigure.OpenAiChatAutoConfiguration
      - org.springframework.ai.model.openai.autoconfigure.OpenAiEmbeddingAutoConfiguration
      - org.springframework.ai.model.openai.autoconfigure.OpenAiImageAutoConfiguration
      - org.springframework.ai.model.openai.autoconfigure.OpenAiAudioSpeechAutoConfiguration
      - org.springframework.ai.model.openai.autoconfigure.OpenAiAudioTranscriptionAutoConfiguration
      - org.springframework.ai.model.openai.autoconfigure.OpenAiModerationAutoConfiguration
  jackson:
    default-property-inclusion: non_null
    # 保持与 Python to_dict() 一致的 camelCase 输出
    property-naming-strategy: LOWER_CAMEL_CASE
    serialization:
      # 日期输出 ISO 字符串，对齐 Python isoformat()
      write-dates-as-timestamps: false
    time-zone: GMT+8
    deserialization:
      fail-on-unknown-properties: false
  # 数据源：默认 H2 内嵌库（MySQL 兼容模式，无需外部数据库即可启动）；
  # 生产/联调接 MySQL 时设置 SPRING_DATASOURCE_URL 指向 jdbc:mysql://... 即可整体切回
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:h2:file:./data/prodplatformai;MODE=MySQL;DATABASE_TO_LOWER=TRUE;CASE_INSENSITIVE_IDENTIFIERS=TRUE;AUTO_SERVER=TRUE}
    driver-class-name: ${SPRING_DATASOURCE_DRIVER:org.h2.Driver}
    username: ${SPRING_DATASOURCE_USERNAME:sa}
    password: ${SPRING_DATASOURCE_PASSWORD:}
  # H2 内嵌库：每次启动以 sql/h2/schema-h2.sql 建表并灌入种子数据（CREATE IF NOT EXISTS 幂等）
  # 注意：spring.sql.init 是与 datasource 平级的顶级键，不要嵌进 datasource 下
  sql:
    init:
      mode: ${SPRING_SQL_INIT_MODE:embedded}
      platform: h2
      schema-locations: classpath:sql/h2/schema-h2.sql
      data-locations: classpath:sql/h2/data-h2.sql
      continue-on-error: false
  h2:
    console:
      enabled: ${H2_CONSOLE_ENABLED:true}
      path: /h2-console
  # MyBatis Plus：替代原 JPA/Hibernate 配置
  # 注意：表结构由 sql/（MySQL）与 sql/h2/（H2）脚本管理（原 JPA ddl-auto 不再生效）

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.slf4j.Slf4jImpl
  global-config:
    banner: false
    db-config:
      id-type: auto

prodai:
  ontology:
    # 生产默认关闭演示数据护栏；本地演示见 application-dev.yml / application-demo.yml
    # 演示与生产共用同一套业务代码，仅 graph-path / data-source 不同
    demo-enabled: false
    # classpath | http | jdbc | empty
    data-source: ${ONTOLOGY_DATA_SOURCE:classpath}
    # ABox 生产同步源（R5）：mock（默认，走 classpath/http）| jdbc（业务系统只读库直连）
    abox-source: ${ABOX_SOURCE:mock}
    # abox-source=jdbc 时生效：首次全量 + 定时刷新（分钟），失败自动回退 last-known-good
    abox-sync-enabled: ${ABOX_SYNC_ENABLED:true}
    abox-sync-interval-minutes: ${ABOX_SYNC_INTERVAL_MINUTES:30}
    abox-jdbc-url: ${ABOX_JDBC_URL:}
    abox-jdbc-username: ${ABOX_JDBC_USERNAME:}
    abox-jdbc-password: ${ABOX_JDBC_PASSWORD:}
    abox-jdbc-driver: ${ABOX_JDBC_DRIVER:com.mysql.cj.jdbc.Driver}
    # 单次同步最大行数护栏（防全表拖垮内存）
    abox-max-rows: ${ABOX_MAX_ROWS:10000}
    graph-path: ${ONTOLOGY_GRAPH_PATH:}
    ops-graph-path: ${ONTOLOGY_OPS_GRAPH_PATH:}
    product-center-base-url: ${PRODUCT_CENTER_BASE_URL:}
    product-center-timeout-ms: ${PRODUCT_CENTER_TIMEOUT_MS:5000}
    llm-extract-enabled: ${ONTOLOGY_LLM_EXTRACT:true}
    # 智查检索词典兜底开关：默认 false——检索统一走本体知识库（SPARQL），
    # 0 命中如实返回；应急回退词典打分时才显式置 true
    discover-dict-fallback: ${ONTOLOGY_DISCOVER_DICT_FALLBACK:false}
    rules-path: classpath:ontology/ops_rules.json
    product-ops-owl-path: classpath:ontology/product-ops.ttl
    swrl-enabled: true
    base-iri: ${ONTOLOGY_BASE_IRI:http://example.org/}
    # 空=不灌 RDF；演示 profile 指向 rdf_seed.json
    rdf-seed-path: ${ONTOLOGY_RDF_SEED_PATH:}
    ttl-path: ${ONTOLOGY_TTL_PATH:}
    config-ttl-path: ${ONTOLOGY_CONFIG_TTL_PATH:}
  kb:
    seed-path: ${KB_SEED_PATH:}
  mcp:
    seed-path: ${MCP_SEED_PATH:}
  auth:
    # 认证开关（JWT 登录）；本地开发可设 AUTH_ENABLED=false 关闭
    enabled: ${AUTH_ENABLED:true}
    # JWT 签名密钥：生产必须通过环境变量 AUTH_JWT_SECRET 注入统一密钥（多实例一致）；
    # 未配置时使用实例级派生密钥（仅单机可用，且每日轮换会导致重新登录）
    jwt-secret: ${AUTH_JWT_SECRET:}
  # 流程意图路由（S1 对话即编排）：命中关键词 → 固定流程引擎直达；未命中走原 LLM 链路
  flow-router:
    enabled: true
    routes:
      - workflow-code: demo_linear_flow
        display-name: 演示线性流程
        keywords: [跑一下演示流程, 演示流程, demo流程]
  # 场景工作流配置（W3 遗产，已被手册层全面取代）：理解层意图确定性映射到场景工作流，
  # 未命中场景走 LLM 动态编排；场景未配置（空串/缺失）= 该场景暂不启用。
  # rd 已移除：三大主意图（RD_CONFIG_CHAT/RD_FILE_PARSE/RD_CONFIG_DISCOVER）现全部
  # 命中手册（chat-configure/doc-batch-import/discover-history），固化工作流被架空（去旧留新）。
  # ops 已移除：运营问诊主链路收拢到手册 ops-analysis，固化工作流 ops_analysis_v2 退役。
  # query 已移除：查询复用链路收拢到手册 query-ask（智能问答），固化工作流 query_reuse_v2 退役
  # （纯问询一步 sparql 即可作答，固化三节点 discover→sparql→compare 是杀鸡用牛刀且不产答案话术）。
  chat-workflow:
    scene-workflows: {}
  llm:
    enabled: ${LLM_ENABLED:true}
    function-calling-enabled: ${LLM_FC_ENABLED:true}
    # 模型连接配置统一落库 pd_ai_llm_user_configs（推理平台管理页 /api/v1/llm-config 管理），
    # 激活项（is_active=true）即默认生效模型，支持运行时切换，无需重启。
    # 可用模型列表：GET /api/v1/chat/model/available

management:
  endpoints:
    web:
      exposure:
        include: health,loggers
  endpoint:
    loggers:
      enabled: true

logging:
  level:
    root: DEBUG
    com.sitech.prodai: DEBUG
    # 抑制过于吵闹的框架 DEBUG 噪音，保留关键诊断信息
    org.apache.catalina: INFO
    org.apache.coyote: INFO
    org.apache.tomcat: INFO
    org.springframework.context.annotation: WARN
