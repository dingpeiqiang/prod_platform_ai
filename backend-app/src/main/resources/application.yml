server:
  port: 6174

spring:
  application:
    name: prod-platform-ai
  profiles:
    # 上线默认 prod（demo 关闭）；本地演示改 active:dev 或 --spring.profiles.active=dev
    active: prod
  # LLM 调用统一走手动构建（见 LlmService），不走 Spring AI 自动配置，
  # 因此禁用 OpenAI 自动配置并移除冗余的 spring.ai.openai.* 属性，避免创建未使用的 Bean。
  autoconfigure:
    exclude:
      - org.springframework.ai.model.openai.autoconfigure.OpenAiChatAutoConfiguration
      - org.springframework.ai.model.openai.autoconfigure.OpenAiEmbeddingAutoConfiguration
      - org.springframework.ai.model.openai.autoconfigure.OpenAiImageAutoConfiguration
      - org.springframework.ai.model.openai.autoconfigure.OpenAiAudioSpeechAutoConfiguration
      - org.springframework.ai.model.openai.autoconfigure.OpenAiAudioTranscriptionAutoConfiguration
      - org.springframework.ai.model.openai.autoconfigure.OpenAiModerationAutoConfiguration
  jackson:
    default-property-inclusion: non_null
    # 保持与 Python to_dict() 一致的 camelCase 输出
    property-naming-strategy: LOWER_CAMEL_CASE
    serialization:
      # 日期输出 ISO 字符串，对齐 Python isoformat()
      write-dates-as-timestamps: false
    time-zone: GMT+8
    deserialization:
      fail-on-unknown-properties: false
  # 数据源：与 backend 保持一致，默认连接 MySQL；如需本地开发可通过环境变量切换
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/prodplatformai?useUnicode=true&characterEncoding=utf8&useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true}
    driver-class-name: com.mysql.cj.jdbc.Driver
    username: ${SPRING_DATASOURCE_USERNAME:prodplatformai}
    password: ${SPRING_DATASOURCE_PASSWORD:prodplatformai@134}
  jpa:
    hibernate:
      ddl-auto: ${SPRING_JPA_HIBERNATE_DDL_AUTO:update}
    show-sql: false
    open-in-view: false
    query-lookup-strategy: CREATE
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.MySQLDialect

prodai:
  ontology:
    # 生产默认关闭演示数据护栏；本地演示见 application-dev.yml / application-demo.yml
    # 演示与生产共用同一套业务代码，仅 graph-path / data-source 不同
    demo-enabled: false
    # classpath | http | empty
    data-source: ${ONTOLOGY_DATA_SOURCE:classpath}
    graph-path: ${ONTOLOGY_GRAPH_PATH:}
    ops-graph-path: ${ONTOLOGY_OPS_GRAPH_PATH:}
    product-center-base-url: ${PRODUCT_CENTER_BASE_URL:}
    product-center-timeout-ms: ${PRODUCT_CENTER_TIMEOUT_MS:5000}
    llm-extract-enabled: ${ONTOLOGY_LLM_EXTRACT:true}
    rules-path: classpath:ontology/ops_rules.json
    product-ops-owl-path: classpath:ontology/product-ops.ttl
    swrl-enabled: true
    base-iri: ${ONTOLOGY_BASE_IRI:http://example.org/}
    # 空=不灌 RDF；演示 profile 指向 rdf_seed.json
    rdf-seed-path: ${ONTOLOGY_RDF_SEED_PATH:}
    ttl-path: ${ONTOLOGY_TTL_PATH:}
    config-ttl-path: ${ONTOLOGY_CONFIG_TTL_PATH:}
  kb:
    seed-path: ${KB_SEED_PATH:}
  mcp:
    seed-path: ${MCP_SEED_PATH:}
  llm:
    enabled: ${LLM_ENABLED:true}
    function-calling-enabled: ${LLM_FC_ENABLED:true}
    # 默认生效模型：对应下方 models 中某项的 name，未配置 models 时为空列表
    default-model: ${LLM_DEFAULT_MODEL:teamshub-qwen3-30b-a3b}
    # 多模型配置（各自独立连接）。请求未显式指定模型时采用 default-model 指向的一项；
    # 工作流 LLM 节点 / 前端模型选择可从 GET /api/v1/chat/model/available 获取完整列表。
    models:
      - name: deepseek-chat
        model: ${LLM_MODEL:deepseek-ai/DeepSeek-V4-Flash}
        base-url: ${LLM_BASE_URL:https://api.siliconflow.cn/v1}
        api-key: ${LLM_API_KEY:sk-ddcyjgwywqskqexdhmsbnyjoidmfnjgacvpyecexlysxdogu}
        temperature: ${LLM_TEMPERATURE:0.3}
        max-tokens: ${LLM_MAX_TOKENS:4096}
        thinking: ${LLM_THINKING:false}
        stream-enabled: ${LLM_STREAM_ENABLED:true}
      - name: teamshub-qwen3-30b-a3b
        model: qwen3-30b-a3b
        base-url: https://aicp.teamshub.com/openai/api/v1/openai/v1/chat/completions
        api-key: cb3a5cb469de1d0820d25a1e6349306dc4482f90
        temperature: 0.3
        max-tokens: 4096
        thinking: false
        stream-enabled: true

management:
  endpoints:
    web:
      exposure:
        include: health,loggers
  endpoint:
    loggers:
      enabled: true

logging:
  level:
    root: DEBUG
    com.sitech.prodai: DEBUG
    # 抑制过于吵闹的框架 DEBUG 噪音，保留关键诊断信息
    org.apache.catalina: INFO
    org.apache.coyote: INFO
    org.apache.tomcat: INFO
    org.hibernate.orm.deprecation: WARN
    org.springframework.context.annotation: WARN
