server:
  port: 6174

spring:
  application:
    name: prod-platform-ai
  profiles:
    # 上线默认 prod（demo 关闭）；本地演示改 active:dev 或 --spring.profiles.active=dev
    active: prod
  # LLM 调用统一走手动构建（见 LlmService），不走 Spring AI 自动配置，
  # 因此禁用 OpenAI 自动配置并移除冗余的 spring.ai.openai.* 属性，避免创建未使用的 Bean。
  autoconfigure:
    exclude:
      - org.springframework.ai.model.openai.autoconfigure.OpenAiChatAutoConfiguration
      - org.springframework.ai.model.openai.autoconfigure.OpenAiEmbeddingAutoConfiguration
      - org.springframework.ai.model.openai.autoconfigure.OpenAiImageAutoConfiguration
      - org.springframework.ai.model.openai.autoconfigure.OpenAiAudioSpeechAutoConfiguration
      - org.springframework.ai.model.openai.autoconfigure.OpenAiAudioTranscriptionAutoConfiguration
      - org.springframework.ai.model.openai.autoconfigure.OpenAiModerationAutoConfiguration
  jackson:
    default-property-inclusion: non_null
    # 保持与 Python to_dict() 一致的 camelCase 输出
    property-naming-strategy: LOWER_CAMEL_CASE
    serialization:
      # 日期输出 ISO 字符串，对齐 Python isoformat()
      write-dates-as-timestamps: false
    time-zone: GMT+8
    deserialization:
      fail-on-unknown-properties: false
  # 数据源：默认连 MySQL / GoldenDB 分布式库（10.88.154.215:8100/pmsdb，归因证据 attribution_* 所在库）；
  # 本地离线开发可用 SPRING_DATASOURCE_URL 覆盖回 H2（jdbc:h2:file:...;MODE=MySQL）
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:mysql://10.88.154.215:8100/pmsdb?useUnicode=true&characterEncoding=utf8&useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true&zeroDateTimeBehavior=convertToNull}
    driver-class-name: ${SPRING_DATASOURCE_DRIVER:com.mysql.cj.jdbc.Driver}
    username: ${SPRING_DATASOURCE_USERNAME:dbpmsopr}
    password: ${SPRING_DATASOURCE_PASSWORD:Dbpmsopr12$#}
    hikari:
      # 分布式库跨机房建连较慢，放宽超时避免启动即失败
      connection-timeout: 15000
      validation-timeout: 5000
      maximum-pool-size: 20
  # 表结构与种子数据由 sql/mysql/ 脚本人工执行（分布式库需 distributed by 方言，
  # 且执行账号需 DDL 权限）；应用启动不自动建表。
  # 固定为 never 且不读环境变量：mysql 索引脚本（ALTER TABLE ADD INDEX）非幂等，
  # 若被外部注入 SPRING_SQL_INIT_MODE=always 会每次启动重跑并报错、拖慢启动。
  # H2/容器内离线演示由 docker/config/application.yml 单独覆盖为 embedded。
  sql:
    init:
      mode: never
  h2:
    console:
      enabled: ${H2_CONSOLE_ENABLED:false}
      path: /h2-console
  # MyBatis Plus：替代原 JPA/Hibernate 配置
  # 注意：表结构由 sql/（MySQL）与 sql/h2/（H2）脚本管理（原 JPA ddl-auto 不再生效）

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.slf4j.Slf4jImpl
  global-config:
    banner: false
    db-config:
      id-type: auto

# SpringDoc OpenAPI 接口文档（后台管理中心「接口管理」模块）
# Swagger UI: /swagger-ui.html ；OpenAPI JSON: /v3/api-docs
# API_GATEWAY_URL 形如 http://localhost:6174 ，用于 UI 展示 Try-it-out 的服务器地址
springdoc:
  api-docs:
    enabled: ${API_DOCS_ENABLED:true}
    path: /v3/api-docs
  swagger-ui:
    enabled: ${SWAGGER_UI_ENABLED:true}
    path: /swagger-ui.html
    tags-sorter: alpha
    operations-sorter: alpha
  show-actuator: false

prodai:
  ontology:
    # 生产默认关闭演示数据护栏；本地演示见 application-dev.yml
    # 演示与生产共用同一套业务代码，仅 graph-path / data-source 不同
    demo-enabled: false
    # classpath | http | jdbc | empty
    data-source: ${ONTOLOGY_DATA_SOURCE:classpath}
    # ABox 定时同步开关：仅 data-source=jdbc 时生效（首次全量 + 定时刷新，失败回退 last-known-good）
    abox-sync-enabled: ${ABOX_SYNC_ENABLED:false}
    abox-sync-interval-minutes: ${ABOX_SYNC_INTERVAL_MINUTES:30}
    abox-jdbc-url: ${ABOX_JDBC_URL:}
    abox-jdbc-username: ${ABOX_JDBC_USERNAME:}
    abox-jdbc-password: ${ABOX_JDBC_PASSWORD:}
    abox-jdbc-driver: ${ABOX_JDBC_DRIVER:com.mysql.cj.jdbc.Driver}
    # 单次同步最大行数护栏（防全表拖垮内存）
    abox-max-rows: ${ABOX_MAX_ROWS:10000}
    # 防御默认：未显式设置 ONTOLOGY_GRAPH_PATH 时回退生产导出图，
    # 避免部署漏配 graph-path 导致事实图为空（root-cause / shelf-compliance 全程 backend_pending）。
    graph-path: ${ONTOLOGY_GRAPH_PATH:classpath:ontology/ops_graph_export.json}
    ops-graph-path: ${ONTOLOGY_OPS_GRAPH_PATH:classpath:ontology/ops_graph_export.json}
    product-center-base-url: ${PRODUCT_CENTER_BASE_URL:}
    product-center-timeout-ms: ${PRODUCT_CENTER_TIMEOUT_MS:5000}
    llm-extract-enabled: ${ONTOLOGY_LLM_EXTRACT:true}
    # 智查检索词典兜底开关：默认 false——检索统一走本体知识库（SPARQL），
    # 0 命中如实返回；应急回退词典打分时才显式置 true
    discover-dict-fallback: ${ONTOLOGY_DISCOVER_DICT_FALLBACK:false}
    # SHACL 转正开关（R7）：试点规则（R-C06/R-C03/R-C05）命中以 SHACL 引擎为准，
    # 引擎失败自动回退 Java；应急回退纯 Java 引擎时置 false
    shacl-authoritative: ${ONTOLOGY_SHACL_AUTHORITATIVE:true}
    rules-path: classpath:ontology/ops_rules.json
    product-ops-owl-path: classpath:ontology/product.ttl
    swrl-enabled: true
    base-iri: ${ONTOLOGY_BASE_IRI:http://example.org/}
    # 空=不灌 RDF；演示 profile 指向 rdf_seed.json
    rdf-seed-path: ${ONTOLOGY_RDF_SEED_PATH:}
    ttl-path: ${ONTOLOGY_TTL_PATH:}
    config-ttl-path: ${ONTOLOGY_CONFIG_TTL_PATH:}
  change-sub:
    # 商品变更订阅提醒（C3）：图谱重载后新旧快照 diff，命中订阅商品落提醒行。
    # 默认关——dev/demo 的 mock 源恒定无真实变更；生产接 jdbc 实源后置 true
    detect-enabled: ${CHANGE_SUB_DETECT_ENABLED:false}
    # 单次检测最大提醒产出数护栏（防大面积资费调整刷屏）
    max-alerts-per-detect: ${CHANGE_SUB_MAX_ALERTS:200}
  # 产销品场景接口适配层（统一方案 §4.5.4）：mode=mock 走模拟报文（开发默认），
  # mode=real 业务报文直接 POST 业务地址，HTTP 请求头带 X-APP-ID/X-APP-KEY/Api-Key/Staff-Code 鉴权；
  # real 调用失败严格报错（REAL_CALL_FAILED，带 EOP 原始 errcode/errmsg），不回退 mock。
  # real-list 为混合模式白名单（similar/upload/notify/insert/sql/testStart/testScenes/testProgress/testResult），
  # 命中走 real、其余 mock。
  appstore:
    # 本体平台（Sitech 本体服务平台）代理配置：wf_sub_01 节点108 P2 要素本体 SWRL 校验调用。
    # 仅记录不阻断：project-id 为空或平台不可用时，代理返回 checked=0，节点108 降级为不校验。
    ontology:
      base-url: ${ONTO_BASE_URL:http://10.88.212.165:9999/data-onto-server}
      # 认证：x-api-key 请求头（sk-onto-<UUID>）；为空则不携带，依赖网关其它鉴权
      api-key: ${ONTO_API_KEY:}
      # 已发布本体项目ID（=工作流节点108 硬编码依据；为空则跳过校验）
      project-id: ${ONTO_PROJECT_ID:}
      # 本体命名空间：模板字段 IRI 由 base-iri + 本地名拼接
      base-iri: ${ONTO_BASE_IRI:http://sitech.com.cn/ontology/prod#}
      timeout-ms: ${ONTO_TIMEOUT_MS:15000}
      swrl:
        # true=执行全部启用规则（ALL_ENABLED）；false=按 rule-ids 指定
        use-all-rules: ${ONTO_SWRL_USE_ALL_RULES:true}
        # use-all-rules=false 时生效，逗号分隔规则ID
        rule-ids: ${ONTO_SWRL_RULE_IDS:}
    interface:
      # 固定 mock，不读环境变量（避免宿主机 APPSTORE_INTERFACE_MODE 覆盖导致误走 real）；
      # 接 EOP 时直接改此值或由 deploy 外部 config/application.yml 覆盖。
      mode: mock
      eop:
        base-url: ${EOP_BASE_URL:https://eop-ops.cloud.anhuitelecom.com:10008}
        # HTTP 请求头鉴权：X-APP-ID / X-APP-KEY / Staff-Code（默认示例值，现场可经环境变量覆盖）
        app-id: ${EOP_APP_ID:91382a43511f4f7e037856c280f0a1f1}
        app-key: ${EOP_APP_KEY:18ce44e39e63f17316404f20177d4252}
        staff-code: ${EOP_STAFF_CODE:501195900}
        # 信封（A1/B4）tcpCont 字段：svcCode 必填（为空时 EOP 报「请求报文svcCode为空」）
        svc-code: ${EOP_SVC_CODE:5012010056}
        envelope-app-key: ${EOP_ENVELOPE_APP_KEY:eOrder1}
        dst-sys-id: ${EOP_DST_SYS_ID:OrderCenter}
        sign: ${EOP_SIGN:123}
        upload-file-field: ${EOP_UPLOAD_FILE_FIELD:file}
        # B1 上传前稽核 Excel 本地落盘目录（文件名自动附加时间戳 _yyyyMMddHHmmss），落盘后再上传 EOP
        upload-dir: ${EOP_UPLOAD_DIR:/data/stq/crmpos/crm-pgcent-mng/upload}
        timeout-ms: ${EOP_TIMEOUT_MS:60000}
        # B1 上传接口：EOP 不支持，改为普通直调地址（绝对地址，优先于 base-url+paths.upload；为空时回落 EOP）
        upload-url: ${EOP_UPLOAD_URL:http://134.95.235.12:5002/upload}
        # 接口键 → 业务路径（拼到 base-url 之后）
        paths:
          similar: ${EOP_PATH_SIMILAR:/api/ah/cpcp/similar}
          upload: ${EOP_PATH_UPLOAD:/api/ah/cpcp/upload}
          notify: ${EOP_PATH_NOTIFY:/api/ah/cpcp/async_report_notify_direct}
          insert: ${EOP_PATH_INSERT:/api/ahhui/cpcp/insertAiAuditResult}
          sql: ${EOP_PATH_SQL:/api/anhui/cpcp/executeSql}
          testStart: ${EOP_PATH_TEST_START:/api/anhui/cpcp/offerTest}
          testScenes: ${EOP_PATH_TEST_SCENES:/api/anhui/cpcp/getTestScenes}
          testProgress: ${EOP_PATH_TEST_PROGRESS:/api/anhui/cpcp/getTestProgress}
          testResult: ${EOP_PATH_TEST_RESULT:/api/anhui/cpcp/getTestResult}
        # 接口键 → EOP ApiID（HTTP 请求头 Api-Key 的值）
        api-keys:
          similar: "2069789780752355328"
          upload: "2069625643688792064"
          notify: "2069670925484838912"
          insert: "2092438683005603840"
          sql: "2070444944312127490"
          testStart: "2070425775141294080"
          testScenes: "2070440544124538880"
          testProgress: "2071410624769560576"
          testResult: "2070435348195577856"
      poll:
        audit:
          interval-ms: 5000
          max: 60
        test:
          interval-ms: 5000
          max: 60
      real-list: []
  kb:
    seed-path: ${KB_SEED_PATH:}
  mcp:
    seed-path: ${MCP_SEED_PATH:}
  auth:
    # 认证开关（JWT 登录）；本地开发可设 AUTH_ENABLED=false 关闭
    enabled: ${AUTH_ENABLED:true}
    # JWT 签名密钥：生产必须通过环境变量 AUTH_JWT_SECRET 注入统一密钥（多实例一致）；
    # 未配置时使用实例级派生密钥（仅单机可用，且每日轮换会导致重新登录）
    jwt-secret: ${AUTH_JWT_SECRET:}
  # 场景工作流配置（W3 遗产，已被手册层全面取代）：理解层意图确定性映射到场景工作流，
  # 未命中场景走 LLM 动态编排；场景未配置（空串/缺失）= 该场景暂不启用。
  # rd 已移除：三大主意图（RD_CONFIG_CHAT/RD_FILE_PARSE/RD_CONFIG_DISCOVER）现全部
  # 命中手册（chat-configure/doc-batch-import/discover-history），固化工作流被架空（去旧留新）。
  # ops 已移除：运营问诊主链路收拢到手册 ops-analysis，固化工作流 ops_analysis_v2 退役。
  # query 已移除：查询复用链路收拢到手册 query-ask（智能问答），固化工作流 query_reuse_v2 退役
  # （纯问询一步 sparql 即可作答，固化三节点 discover→sparql→compare 是杀鸡用牛刀且不产答案话术）。
  chat-workflow:
    scene-workflows: {}
  llm:
    enabled: ${LLM_ENABLED:true}
    function-calling-enabled: ${LLM_FC_ENABLED:true}
    # 模型连接配置统一落库 pd_ai_llm_user_configs（推理平台管理页 /api/v1/llm-config 管理），
    # 激活项（is_active=true）即默认生效模型，支持运行时切换，无需重启。
    # 可用模型列表：GET /api/v1/chat/model/available

management:
  endpoints:
    web:
      exposure:
        include: health,loggers
  endpoint:
    loggers:
      enabled: true

logging:
  level:
    root: DEBUG
    com.sitech.prodai: DEBUG
    # 抑制过于吵闹的框架 DEBUG 噪音，保留关键诊断信息
    org.apache.catalina: INFO
    org.apache.coyote: INFO
    org.apache.tomcat: INFO
    org.springframework.context.annotation: WARN
