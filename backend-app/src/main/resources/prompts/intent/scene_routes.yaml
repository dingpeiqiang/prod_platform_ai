# 超级助手场景路由词表（方案 §3.1 L1 规则快筛）
#
# 用途：scene=auto（超级助手统一入口）时，用户话术的高置信度术语级命中 → 直接定域，
#      未命中或多域冲突 → 交 LLM 判定（L2，理解层同一次调用输出 scene 字段）。
# 铁律：路由层保持确定性、可审计——词表命中即定域（无需 LLM）；词表只收录术语级
#      高置信度词（substring 匹配不偏移），宽泛话术交给理解层 LLM。
# 热更：外部目录 app.prompt-intent-dir 优先（mtime 检测），classpath 回退，
#      与 IntentPromptAssembler 双轨制语义一致。
#
# 冲突消解：一条话术命中多个域 → 不定域（交 L2），并把命中情况注入 LLM 提示。
# 延续语义：全部未命中 → L0 延续判定（上一域挂起态/未终结事务）→ 兜底延续上一域或默认 ops。

version: 1

