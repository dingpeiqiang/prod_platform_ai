# ============================================================
# Prod Platform AI - 前端 Nginx 主配置（完整可独立运行，虚拟机部署）
# 本文件即完整 nginx.conf，由 bin/start.sh 通过:  nginx -c 本文件 加载，
# 不依赖 /etc/nginx 下的全局配置（prefix 下仅需 mime.types）。
# 部署布局（按 crm-pgcent-mng 约定）:
#   <根目录>/crm-pgcent-mng/prod-ai-backend   后端
#   <根目录>/crm-pgcent-mng/prod-ai-frontend  前端（静态根 dist/，本包根含 conf/bin/html）
# 静态目录 root: 下行为默认值，start.sh 会按实际 HTTP_ROOT 动态替换。
# 后端地址 upstream: 保持默认 127.0.0.1:6174（start.sh 不改动）。
# ============================================================

# 运行进程数跟随 CPU
worker_processes  auto;

error_log  logs/error.log warn;
pid        logs/nginx-prod-ai.pid;

events {
    worker_connections  4096;
}

http {
    include       mime.types;
    default_type  application/octet-stream;

    # 便于排查，保留默认 access log
    log_format  main  '$remote_addr - $remote_user [$time_local] "$request" '
                      '$status $body_bytes_sent "$http_referer" '
                      '"$http_user_agent" "$http_x_forwarded_for"';
    access_log  logs/access.log  main;

    sendfile        on;
    tcp_nopush      on;
    keepalive_timeout  65;

    # WebSocket 升级连接映射（start.sh 默认加载本文件时必须定义，否则 nginx -t 报错）
    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      close;
    }

    upstream backend-prodai {
        server 127.0.0.1:6174;
    }

    server {
        listen       80;
        server_name  _;

        root   /opt/crm-pgcent-mng/prod-ai-frontend/dist;
        index  index.html;

        client_max_body_size 30m;
        underscores_in_headers on;

        # 带 hash 的静态资源长期缓存
        location ^~ /assets/ {
            expires 1y;
            add_header Cache-Control "public, immutable";
        }

        # API 反代（SSE / 普通 HTTP）
        location ^~ /api/ {
            proxy_pass http://backend-prodai;
            proxy_http_version 1.1;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Host $host;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_buffering off;          # SSE 需关闭缓冲
            proxy_cache off;
            proxy_read_timeout 86400;
            proxy_send_timeout 86400;
            keepalive_timeout 600;
        }

        # 顶层 WebSocket
        location ^~ /ws/ {
            proxy_pass http://backend-prodai;
            proxy_http_version 1.1;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Host $host;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_read_timeout 86400;
            proxy_send_timeout 86400;
            keepalive_timeout 600;
        }

        # Swagger UI / OpenAPI
        location ^~ /swagger-ui { proxy_pass http://backend-prodai; }
        location ^~ /v3/api-docs { proxy_pass http://backend-prodai; }

        # 后端健康检查直达
        location = /health {
            proxy_pass http://backend-prodai;
        }

        location = /index.html {
            add_header Cache-Control "no-cache";
        }

        # SPA 路由回退
        location / {
            try_files $uri $uri/ /index.html;
            add_header Cache-Control "no-cache";
        }
    }
}
