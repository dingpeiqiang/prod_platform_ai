# ============================================================
# Prod Platform AI - 前端 Nginx 站点配置（虚拟机部署）
# 安装目标: /etc/nginx/conf.d/prod-ai.conf
# 静态目录: /opt/prod-ai/frontend/dist
# 后端地址: 127.0.0.1:6174（单机回环，不对外暴露）
# 由 deploy/frontend/bin/install.sh 自动装配
# ============================================================

upstream backend-prodai {
    server 127.0.0.1:6174;
}

server {
    listen       80;
    server_name  _;

    root   /opt/prod-ai/frontend/dist;
    index  index.html;

    client_max_body_size 30m;
    underscores_in_headers on;

    # 带 hash 的静态资源长期缓存
    location ^~ /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # API 反代（SSE / 普通 HTTP）
    location ^~ /api/ {
        proxy_pass http://backend-prodai;
        proxy_http_version 1.1;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Host $host;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_buffering off;          # SSE 需关闭缓冲
        proxy_cache off;
        proxy_read_timeout 86400;
        proxy_send_timeout 86400;
        keepalive_timeout 600;
    }

    # 顶层 WebSocket
    location ^~ /ws/ {
        proxy_pass http://backend-prodai;
        proxy_http_version 1.1;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Host $host;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_read_timeout 86400;
        proxy_send_timeout 86400;
        keepalive_timeout 600;
    }

    # Swagger UI / OpenAPI
    location ^~ /swagger-ui { proxy_pass http://backend-prodai; }
    location ^~ /v3/api-docs { proxy_pass http://backend-prodai; }

    # 后端健康检查直达
    location = /health {
        proxy_pass http://backend-prodai;
    }

    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    # SPA 路由回退
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache";
    }
}
