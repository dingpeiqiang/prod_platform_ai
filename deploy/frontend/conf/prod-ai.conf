# ============================================================
# Prod Platform AI - 前端 Nginx 主配置（完整可独立运行，虚拟机部署）
# 本文件即完整 nginx.conf，由 bin/start.sh 通过:  nginx -p <本目录> -c 本文件 加载，
# 不依赖 /etc/nginx 下的全局配置。mime.types 随包放在本目录（include 相对 -p 前缀解析）。
# 部署布局（本次部署实际路径）:
#   APP_HOME     = /data/stq/crmpos/crm-pgcent-mng（其下含 prod-ai-backend / prod-ai-frontend）
#   NGINX_HOME   = /data/stq/crmpos/nginx（Nginx 安装前缀，日志/pid 落于其 logs/ 下）
# 静态目录 root: 下行为默认值，start.sh 会按实际 HTTP_ROOT 动态替换。
# 后端地址 upstream: 保持默认 127.0.0.1:6174（start.sh 不改动）。
# 接入方式（子路径前缀）:
#   前端与 API 统一挂在前缀 /prod-ai 下，上游 Nginx（对方机器，对外 80/443）
#   以【不带尾部斜杠】方式转发——前缀原样透传到本机:
#       location /prod-ai/ {
#           proxy_pass http://<本机IP>:6173;    # 注意: 末尾不带 "/"
#           ...                                 # SSE/WS 头同下方各 location
#       }
#   本配置负责剥掉 /prod-ai 前缀后再分发，后端收到的是 /api/... 等无前缀路径（后端零改动）。
# ============================================================

# 运行进程数跟随 CPU
worker_processes  auto;

error_log  /data/stq/crmpos/nginx/logs/error.log warn;
pid        /data/stq/crmpos/nginx/logs/nginx-prod-ai.pid;

events {
    worker_connections  4096;
}

http {
    include       mime.types;
    default_type  application/octet-stream;

    # 便于排查，保留默认 access log
    log_format  main  '$remote_addr - $remote_user [$time_local] "$request" '
                      '$status $body_bytes_sent "$http_referer" '
                      '"$http_user_agent" "$http_x_forwarded_for"';
    access_log  /data/stq/crmpos/nginx/logs/access.log  main;

    sendfile        on;
    tcp_nopush      on;
    keepalive_timeout  65;

    # WebSocket 升级连接映射（start.sh 默认加载本文件时必须定义，否则 nginx -t 报错）
    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      close;
    }

    upstream backend-prodai {
        server 127.0.0.1:6174;
    }

    server {
        listen       6173;
        server_name  _;

        root   /data/stq/crmpos/crm-pgcent-mng/prod-ai-frontend/dist;
        index  index.html;

        client_max_body_size 30m;
        underscores_in_headers on;

        # 带 hash 的静态资源长期缓存（/prod-ai/assets/xx → dist/assets/xx）
        location ^~ /prod-ai/assets/ {
            alias /data/stq/crmpos/crm-pgcent-mng/prod-ai-frontend/dist/assets/;
            expires 1y;
            add_header Cache-Control "public, immutable";
        }

        # API 反代（SSE / 普通 HTTP）：剥前缀后转发，后端收到 /api/...
        location ^~ /prod-ai/api/ {
            rewrite ^/prod-ai(/.*)$ $1 break;
            proxy_pass http://backend-prodai;
            proxy_http_version 1.1;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Host $host;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_buffering off;          # SSE 需关闭缓冲
            proxy_cache off;
            proxy_read_timeout 86400;
            proxy_send_timeout 86400;
            keepalive_timeout 600;
        }

        # 顶层 WebSocket：剥前缀后转发，后端收到 /ws/...
        location ^~ /prod-ai/ws/ {
            rewrite ^/prod-ai(/.*)$ $1 break;
            proxy_pass http://backend-prodai;
            proxy_http_version 1.1;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Host $host;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_read_timeout 86400;
            proxy_send_timeout 86400;
            keepalive_timeout 600;
        }

        # Swagger UI / OpenAPI（剥前缀）
        location ^~ /prod-ai/swagger-ui {
            rewrite ^/prod-ai(/.*)$ $1 break;
            proxy_pass http://backend-prodai;
        }
        location ^~ /prod-ai/v3/api-docs {
            rewrite ^/prod-ai(/.*)$ $1 break;
            proxy_pass http://backend-prodai;
        }

        # 后端健康检查直达（剥前缀）
        location = /prod-ai/health {
            rewrite ^/prod-ai(/.*)$ $1 break;
            proxy_pass http://backend-prodai;
        }

        # 前缀根重定向：/prod-ai → /prod-ai/
        location = /prod-ai {
            return 301 /prod-ai/;
        }

        # SPA 入口与路由回退（/prod-ai/ 下的前端路由）
        location ^~ /prod-ai/ {
            try_files $uri $uri/ /index.html;
            add_header Cache-Control "no-cache";
        }

        # 兼容：无前缀根访问时引导到前缀入口
        location = / {
            return 301 /prod-ai/;
        }
    }
}
