<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>配置工作台 · 独立页面</title>
<link rel="stylesheet" href="./css/workbench.css">
</head>
<body>
<div id="app"></div>

<!-- 运行时依赖：Vue 3 与 ECharts（本地文件，避免 file:// 外链加载问题） -->
<script src="./js/vendor-vue.js"></script>
<script src="./js/vendor-echarts.js"></script>
<script src="./js/elmessage.js"></script>

<!-- 数据与业务逻辑 -->
<!-- Load stage->tab map (single source of truth shared with gen_workflows.py) before business scripts -->
<script>
(function(){
  try {
    var xhr = new XMLHttpRequest();
    xhr.open('GET', './stage-map.json', false); // sync load: activeTab must read the map at init
    xhr.send(null);
    if (xhr.status === 200 || xhr.status === 0) {
      window.__WB_STAGE_MAP = JSON.parse(xhr.responseText);
    }
  } catch (e) { /* file:// or load failure: leave empty, business scripts use built-in fallback */ }
})();
</script>
<script src="./js/data-presets.js"></script>
<script src="./js/app-config-workbench.js"></script>
<script src="./js/ops-view.js"></script>
<script src="./js/wb-context.js"></script>
<script src="./js/wb-products.js"></script>
</body>
</html>
