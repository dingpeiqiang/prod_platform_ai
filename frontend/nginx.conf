# ============================================================
# AI 动态表单平台 - 前端 Nginx（容器内完整主配置）
# 风格对齐现网 nginx（worker / events / http / upstream / ^~）
# 接入方式与现网保持一致：统一挂在前缀 /prod-ai 下，
# 本配置负责剥掉 /prod-ai 前缀后再分发，后端收到的是 /api/... 等无前缀路径。
# 部署时复制为 /etc/nginx/nginx.conf
# ============================================================

# 非 root 运行（基础镜像内置 uid=101 nginx 用户，worker 以该用户运行）
user  nginx;
worker_processes  1;

error_log  /var/log/nginx/error.log  warn;

pid        /run/nginx/nginx.pid;


events {
    worker_connections  1024;
}


http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    log_format  main  '$remote_addr - $remote_user [$time_local] "$request" '
                      '$status $body_bytes_sent "$http_referer" '
                      '"$http_user_agent" "$http_x_forwarded_for" '
                      '"[$request_time]" "[$upstream_response_time]" '
                      '"[$connection]"';

    access_log  /var/log/nginx/access.log  main;

    sendfile        on;
    #tcp_nopush     on;
    underscores_in_headers on;

    #keepalive_timeout  0;
    keepalive_timeout  65;
    proxy_connect_timeout 10;
    proxy_read_timeout 120;
    proxy_send_timeout 60;
    proxy_buffer_size 16k;
    proxy_buffers 4 64k;
    proxy_busy_buffers_size 128k;
    proxy_temp_file_write_size 128k;
    client_header_buffer_size 12k;
    open_file_cache max=204800 inactive=65s;
    open_file_cache_valid 30s;
    open_file_cache_min_uses 1;
    client_max_body_size 30m;

    gzip on;
    gzip_min_length  5k;
    gzip_buffers     4 16k;
    gzip_http_version 1.0;
    gzip_comp_level 9;
    gzip_types    application/javascript text/plain application/x-javascript text/css application/xml text/javascript application/json application/xml+rss image/jpeg image/gif image/png;
    gzip_vary on;

    # WebSocket：有 Upgrade 时 Connection=upgrade，普通 HTTP/SSE 为 close
    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      close;
    }

    # Spring Boot backend-app（同 Docker 网络服务名 backend）
    upstream backend-prodai {
        server backend:6174;
    }

    server {
        listen       6173;
        server_name  _;

        root   /usr/share/nginx/html;
        index  index.html;

        # 带 hash 的静态资源长期缓存（/prod-ai/assets/xx → dist/assets/xx）
        location ^~ /prod-ai/assets/ {
            alias /usr/share/nginx/html/assets/;
            expires 1y;
            add_header Cache-Control "public, immutable";
        }

        # 独立静态页（ops-web 下免登录直嵌页，如 config-workbench.html）
        # 必须用 alias 正确应答 /prod-ai/ops-web/xxx → dist/ops-web/xxx；
        # 否则会被下方 SPA ^~ /prod-ai/ 的 try_files($uri 仍含前缀) 误判为不存在，
        # 回退到 index.html 而加载出整个智能助手 SPA。
        location ^~ /prod-ai/ops-web/ {
            alias /usr/share/nginx/html/ops-web/;
            add_header Cache-Control "no-cache";
        }

        # API 反代（SSE / 普通 HTTP / /api/.../ws WebSocket）：剥前缀后转发
        location ^~ /prod-ai/api/ {
            rewrite ^/prod-ai(/.*)$ $1 break;
            proxy_pass  http://backend-prodai;
            proxy_http_version 1.1;
            proxy_set_header  X-Real-IP  $remote_addr;
            proxy_set_header  X-Forwarded-For  $proxy_add_x_forwarded_for;
            proxy_set_header  X-Forwarded-Proto  $scheme;
            proxy_set_header  Host  $host;
            proxy_set_header  Upgrade  $http_upgrade;
            proxy_set_header  Connection  $connection_upgrade;
            proxy_set_header  Keep-Alive  600;
            # SSE / 长连接：关闭缓冲，拉长读超时
            proxy_buffering off;
            proxy_cache off;
            proxy_read_timeout 86400;
            proxy_send_timeout 86400;
            keepalive_timeout 600;
        }

        # 顶层 WebSocket：剥前缀后转发
        location ^~ /prod-ai/ws/ {
            rewrite ^/prod-ai(/.*)$ $1 break;
            proxy_pass  http://backend-prodai;
            proxy_http_version 1.1;
            proxy_set_header  X-Real-IP  $remote_addr;
            proxy_set_header  Host  $host;
            proxy_set_header  X-Forwarded-For  $proxy_add_x_forwarded_for;
            proxy_set_header  X-Forwarded-Proto  $scheme;
            proxy_set_header  Upgrade  $http_upgrade;
            proxy_set_header  Connection  $connection_upgrade;
            proxy_set_header  Keep-Alive  600;
            proxy_read_timeout 86400;
            proxy_send_timeout 86400;
            keepalive_timeout 600;
        }

        # Swagger UI / OpenAPI（剥前缀）
        location ^~ /prod-ai/swagger-ui {
            rewrite ^/prod-ai(/.*)$ $1 break;
            proxy_pass http://backend-prodai;
        }
        location ^~ /prod-ai/v3/api-docs {
            rewrite ^/prod-ai(/.*)$ $1 break;
            proxy_pass http://backend-prodai;
        }

        # 容器健康检查：统一走 /prod-ai 前缀探活（与 deploy 版保持一致）
        location = /prod-ai/health {
            default_type text/plain;
            return 200 'OK';
        }

        # 前缀根重定向：/prod-ai → /prod-ai/
        location = /prod-ai {
            return 301 /prod-ai/;
        }

        # SPA 入口与路由回退（/prod-ai/ 下的前端路由）
        location ^~ /prod-ai/ {
            try_files $uri $uri/ /index.html;
            add_header Cache-Control "no-cache";
        }

        # 兼容：无前缀根访问时引导到前缀入口
        location = / {
            return 301 /prod-ai/;
        }
    }
}
