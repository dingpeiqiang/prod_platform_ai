# ============================================================
# AI 动态表单平台 - 前端 Nginx（容器内完整主配置）
# 风格对齐现网 nginx（worker / events / http / upstream / ^~）
# 部署时复制为 /etc/nginx/nginx.conf
# ============================================================

# 非 root 运行（基础镜像内置 uid=101 nginx 用户，worker 以该用户运行）
user  nginx;
worker_processes  1;

error_log  /var/log/nginx/error.log  warn;

pid        /run/nginx/nginx.pid;


events {
    worker_connections  1024;
}


http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    log_format  main  '$remote_addr - $remote_user [$time_local] "$request" '
                      '$status $body_bytes_sent "$http_referer" '
                      '"$http_user_agent" "$http_x_forwarded_for" '
                      '"[$request_time]" "[$upstream_response_time]" '
                      '"[$connection]"';

    access_log  /var/log/nginx/access.log  main;

    sendfile        on;
    #tcp_nopush     on;
    underscores_in_headers on;

    #keepalive_timeout  0;
    keepalive_timeout  65;
    proxy_connect_timeout 10;
    proxy_read_timeout 120;
    proxy_send_timeout 60;
    proxy_buffer_size 16k;
    proxy_buffers 4 64k;
    proxy_busy_buffers_size 128k;
    proxy_temp_file_write_size 128k;
    client_header_buffer_size 12k;
    open_file_cache max=204800 inactive=65s;
    open_file_cache_valid 30s;
    open_file_cache_min_uses 1;
    client_max_body_size 30m;

    gzip on;
    gzip_min_length  5k;
    gzip_buffers     4 16k;
    gzip_http_version 1.0;
    gzip_comp_level 9;
    gzip_types    application/javascript text/plain application/x-javascript text/css application/xml text/javascript application/json application/xml+rss image/jpeg image/gif image/png;
    gzip_vary on;

    # WebSocket：有 Upgrade 时 Connection=upgrade，普通 HTTP/SSE 为 close
    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      close;
    }

    # Spring Boot backend-app（同 Docker 网络服务名 backend）
    upstream backend-prodai {
        server backend:6174;
    }

    server {
        listen       6173;
        server_name  _;

        root   /usr/share/nginx/html;
        index  index.html;

        # 带 hash 的静态资源长期缓存
        location ^~ /assets/ {
            expires 1y;
            add_header Cache-Control "public, immutable";
        }

        # API 反代（SSE / 普通 HTTP / /api/.../ws WebSocket）
        location ^~ /api/ {
            proxy_pass  http://backend-prodai;
            proxy_http_version 1.1;
            proxy_set_header  X-Real-IP  $remote_addr;
            proxy_set_header  X-Forwarded-For  $proxy_add_x_forwarded_for;
            proxy_set_header  X-Forwarded-Proto  $scheme;
            proxy_set_header  Host  $host;
            proxy_set_header  Upgrade  $http_upgrade;
            proxy_set_header  Connection  $connection_upgrade;
            proxy_set_header  Keep-Alive  600;
            # SSE / 长连接：关闭缓冲，拉长读超时
            proxy_buffering off;
            proxy_cache off;
            proxy_read_timeout 86400;
            proxy_send_timeout 86400;
            keepalive_timeout 600;
        }

        # 顶层 WebSocket
        location ^~ /ws/ {
            proxy_pass  http://backend-prodai;
            proxy_http_version 1.1;
            proxy_set_header  X-Real-IP  $remote_addr;
            proxy_set_header  Host  $host;
            proxy_set_header  Upgrade  $http_upgrade;
            proxy_set_header  Connection  $connection_upgrade;
            proxy_set_header  Keep-Alive  600;
            proxy_read_timeout 86400;
            proxy_send_timeout 86400;
            keepalive_timeout 600;
        }

        # 前端容器健康检查
        location = /health {
            default_type text/plain;
            return 200 'OK';
        }

        # 入口页禁缓存
        location = /index.html {
            add_header Cache-Control "no-cache";
        }

        # SPA 路由回退
        location / {
            try_files $uri $uri/ /index.html;
            add_header Cache-Control "no-cache";
        }

        # ----------------------------------------------------------
        # 现网网关挂载示例（listen 9017 场景，按需启用并改 alias 路径）
        # location ^~ /crm-pgcent-prodai-op-web/ {
        #     alias /web/mng/pgcweb/crm-pgcent-mng/crm-pgcent-prodai-op-web/;
        #     index index.html;
        #     try_files $uri $uri/ /crm-pgcent-prodai-op-web/index.html;
        #     add_header Cache-Control no-cache;
        # }
        # ----------------------------------------------------------
    }
}
