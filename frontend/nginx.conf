server {
    listen 80;
    server_name _;

    # 前端静态文件
    root /usr/share/nginx/html;
    index index.html;

    # Gzip 压缩（server 块内仅保留 gzip_types / min_length；gzip on 放在 http 级更稳妥，
    # Alpine 默认已开启 gzip，此处显式声明兼容独立 conf）
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;
    gzip_min_length 1024;

    # 静态资源缓存（带 hash 的文件可以长期缓存）
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # SPA 所有路由回退到 index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    # API 代理到 Spring Boot backend-app（6174）
    location /api/ {
        proxy_pass http://backend:6174;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_cache off;

        # SSE / 长连接
        proxy_read_timeout 86400;
        proxy_send_timeout 86400;
    }

    # WebSocket 代理
    location /ws/ {
        proxy_pass http://backend:6174;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_read_timeout 86400;
    }

    # 健康检查（前端容器自身）
    location /health {
        return 200 'OK';
        add_header Content-Type text/plain;
    }
}
